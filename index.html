<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Kamyon Tartım Hesaplama</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0f1419;
            font-family: -apple-system, 'Segoe UI', 'Roboto', sans-serif;
            padding: 24px 16px 40px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            max-width: 580px;
            width: 100%;
            margin: 0 auto;
            background: #1a1f2e;
            border-radius: 32px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            border: 1px solid #2a3040;
        }

        .hero {
            background: linear-gradient(135deg, #1a2a1f 0%, #0d1f14 100%);
            padding: 28px 20px;
            text-align: center;
            border-bottom: 1px solid #2a3a2f;
        }

        .hero h1 {
            font-size: 1.7rem;
            font-weight: 600;
            color: #4ade80;
            letter-spacing: -0.3px;
            text-shadow: 0 0 20px rgba(74, 222, 128, 0.3);
        }

        .form-container {
            padding: 24px 20px 16px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #8ba89c;
            margin-bottom: 8px;
            display: block;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            background: #242b3d;
            border-radius: 16px;
            border: 1px solid #2a3040;
            transition: all 0.3s;
        }

        .input-wrapper:focus-within {
            border-color: #4ade80;
            background: #1e2535;
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.1);
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px;
            font-size: 1.1rem;
            font-weight: 500;
            border: none;
            background: transparent;
            outline: none;
            font-family: monospace;
            color: #e2e8f0;
        }

        .input-wrapper input::placeholder {
            color: #556170;
            font-weight: 400;
        }

        .calc-btn {
            width: 100%;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none;
            padding: 16px;
            border-radius: 16px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 20px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .calc-btn:hover {
            box-shadow: 0 6px 25px rgba(16, 185, 129, 0.5);
            transform: translateY(-1px);
        }

        .calc-btn:active {
            transform: scale(0.97);
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
        }

        .results {
            background: #242b3d;
            margin: 8px 20px 20px 20px;
            border-radius: 24px;
            padding: 8px 0;
            border: 1px solid #2a3040;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 16px 20px;
            border-bottom: 1px solid #2a3040;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-label {
            font-weight: 600;
            font-size: 1rem;
            color: #8ba89c;
        }

        .result-value {
            font-weight: 700;
            font-size: 1.5rem;
            font-family: monospace;
            color: #4ade80;
            background: #1a2a1f;
            padding: 6px 16px;
            border-radius: 40px;
            border: 1px solid #2a3a2f;
        }

        .save-section {
            margin: 0 20px 20px 20px;
            padding: 20px;
            background: #242b3d;
            border-radius: 24px;
            border: 1px solid #2a3040;
        }

        .save-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .save-input {
            flex: 1;
            min-width: 120px;
        }

        .save-input input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #2a3040;
            border-radius: 14px;
            font-size: 0.9rem;
            background: #1a1f2e;
            outline: none;
            transition: 0.3s;
            color: #e2e8f0;
        }

        .save-input input:focus {
            border-color: #4ade80;
            box-shadow: 0 0 15px rgba(74, 222, 128, 0.1);
        }

        .save-input input::placeholder {
            color: #556170;
        }

        .save-btn {
            width: 100%;
            background: #3b82f6;
            border: none;
            padding: 14px;
            border-radius: 14px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
            letter-spacing: 0.5px;
        }

        .save-btn:hover {
            background: #2563eb;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .save-btn:active {
            transform: scale(0.97);
            background: #1d4ed8;
        }

        .history-section {
            margin: 0 20px 24px 20px;
        }

        .history-title {
            font-weight: 600;
            color: #8ba89c;
            margin-bottom: 16px;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .clear-history {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #ef4444;
            font-size: 0.75rem;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 20px;
            transition: all 0.3s;
        }

        .clear-history:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        .history-list {
            max-height: 320px;
            overflow-y: auto;
            background: #242b3d;
            border-radius: 20px;
            border: 1px solid #2a3040;
        }

        .history-list::-webkit-scrollbar {
            width: 4px;
        }

        .history-list::-webkit-scrollbar-track {
            background: #1a1f2e;
            border-radius: 10px;
        }

        .history-list::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 10px;
        }

        .history-item {
            padding: 16px;
            border-bottom: 1px solid #2a3040;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .history-item:hover {
            background: #2a3040;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-weight: 600;
            color: #e2e8f0;
        }

        .history-name {
            color: #4ade80;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .history-date {
            color: #6b7280;
            font-size: 0.75rem;
        }

        .history-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .history-girdiler {
            background: #1a1f2e;
            padding: 10px 12px;
            border-radius: 12px;
            margin: 10px 0;
            font-size: 0.75rem;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            color: #8ba89c;
            border: 1px solid #2a3040;
        }

        .history-values {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            font-family: monospace;
            font-size: 0.8rem;
            color: #6ee7b7;
            margin-top: 8px;
            padding: 10px;
            background: rgba(74, 222, 128, 0.05);
            border-radius: 10px;
        }

        .delete-item {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #ef4444;
            font-size: 0.9rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .delete-item:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        .share-history-btn {
            background: rgba(37, 211, 102, 0.1);
            border: 1px solid #25d366;
            color: #25d366;
            font-size: 0.8rem;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 8px;
            transition: all 0.3s;
            font-weight: 600;
        }

        .share-history-btn:hover {
            background: rgba(37, 211, 102, 0.2);
        }

        .reset-btn {
            background: none;
            border: 1px solid #4b5563;
            font-size: 0.8rem;
            color: #9ca3af;
            padding: 8px 16px;
            margin: 0 20px 20px auto;
            display: block;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s;
        }

        .reset-btn:hover {
            background: #242b3d;
            color: #e2e8f0;
        }

        .reset-btn:active {
            opacity: 0.7;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px 12px;
            }
            .result-value {
                font-size: 1.2rem;
                padding: 4px 12px;
            }
            .save-row {
                flex-direction: column;
                gap: 8px;
            }
            .history-header {
                flex-wrap: wrap;
                gap: 8px;
            }
            .history-actions {
                width: 100%;
                justify-content: flex-end;
            }
        }

        .toast-msg {
            background: #3b82f6;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 0.85rem;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
            z-index: 200;
            white-space: nowrap;
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
        }

        .toast-msg.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }
    </style>
</head>
<body>

<div class="card">
    <div class="hero">
        <h1>⚖️ KAMYON TARTIM</h1>
    </div>

    <div class="form-container">
        <div class="input-group">
            <label>KAMYON BOŞ</label>
            <div class="input-wrapper">
                <input type="number" id="bosKamyon" placeholder="0" step="any">
            </div>
        </div>

        <div class="input-group">
            <label>KAMYON DOLU</label>
            <div class="input-wrapper">
                <input type="number" id="doluKamyon" placeholder="0" step="any">
            </div>
        </div>

        <div class="input-group">
            <label>SHENK</label>
            <div class="input-wrapper">
                <input type="number" id="shenk" placeholder="0" step="any">
            </div>
        </div>

        <div class="input-group">
            <label>ESKİ CF</label>
            <div class="input-wrapper">
                <input type="number" id="eskiCf" placeholder="1.000" step="any">
            </div>
        </div>

        <button class="calc-btn" id="hesaplaBtn">HESAPLA</button>
    </div>

    <div class="results">
        <div class="result-item">
            <span class="result-label">NET</span>
            <span class="result-value" id="netDeger">—</span>
        </div>
        <div class="result-item">
            <span class="result-label">FARK</span>
            <span class="result-value" id="farkDeger">—</span>
        </div>
        <div class="result-item">
            <span class="result-label">YENİ CF</span>
            <span class="result-value" id="yeniCfDeger">—</span>
        </div>
        <div class="result-item">
            <span class="result-label">HATA ORANI</span>
            <span class="result-value" id="hataOranDeger">—</span>
        </div>
    </div>

    <div class="save-section">
        <div class="save-row">
            <div class="save-input">
                <input type="text" id="kayitIsim" placeholder="İsim / Plaka / Not">
            </div>
            <div class="save-input">
                <input type="date" id="kayitTarih">
            </div>
        </div>
        <button class="save-btn" id="kaydetBtn">💾 KAYDET</button>
    </div>

    <div class="history-section">
        <div class="history-title">
            <span>📋 GEÇMİŞ HESAPLAR</span>
            <button class="clear-history" id="temizleGecmisBtn">🗑 TÜMÜNÜ SİL</button>
        </div>
        <div class="history-list" id="gecmisListesi">
            <div style="padding: 20px; text-align: center; color: #6b7280;">Henüz kayıt yok</div>
        </div>
    </div>

    <button class="reset-btn" id="resetBtn">TEMİZLE</button>
</div>

<div id="toastMsg" class="toast-msg"></div>

<script>
    (function() {
        const bosInput = document.getElementById('bosKamyon');
        const doluInput = document.getElementById('doluKamyon');
        const shenkInput = document.getElementById('shenk');
        const eskiCfInput = document.getElementById('eskiCf');
        const hesaplaBtn = document.getElementById('hesaplaBtn');
        const resetBtn = document.getElementById('resetBtn');
        const kaydetBtn = document.getElementById('kaydetBtn');
        const temizleGecmisBtn = document.getElementById('temizleGecmisBtn');
        const kayitIsim = document.getElementById('kayitIsim');
        const kayitTarih = document.getElementById('kayitTarih');

        const netSpan = document.getElementById('netDeger');
        const farkSpan = document.getElementById('farkDeger');
        const yeniCfSpan = document.getElementById('yeniCfDeger');
        const hataOranSpan = document.getElementById('hataOranDeger');

        const toast = document.getElementById('toastMsg');
        const gecmisListesi = document.getElementById('gecmisListesi');

        let toastTimeout = null;
        let sonHesaplanan = null;
        let sonGirdiler = null;

        let kayitlar = [];

        function loadHistory() {
            const stored = localStorage.getItem('kamyonHesaplari');
            if (stored) {
                try {
                    kayitlar = JSON.parse(stored);
                } catch(e) { kayitlar = []; }
            } else {
                kayitlar = [];
            }
            renderHistory();
        }

        function saveHistory() {
            localStorage.setItem('kamyonHesaplari', JSON.stringify(kayitlar));
            renderHistory();
        }

        function renderHistory() {
            if (!gecmisListesi) return;
            
            if (kayitlar.length === 0) {
                gecmisListesi.innerHTML = '<div style="padding: 20px; text-align: center; color: #6b7280;">Henüz kayıt yok</div>';
                return;
            }
            
            const tersKayitlar = [...kayitlar].reverse();
            
            gecmisListesi.innerHTML = tersKayitlar.map((item, index) => {
                const originalIndex = kayitlar.length - 1 - index;
                return `
                    <div class="history-item">
                        <div class="history-header">
                            <span class="history-name">🚛 ${escapeHtml(item.isim) || 'İsimsiz'}</span>
                            <div class="history-actions">
                                <span class="history-date">📅 ${item.tarih || 'Tarihsiz'}</span>
                                <button class="share-history-btn" data-index="${originalIndex}">📤 PAYLAŞ</button>
                                <button class="delete-item" data-index="${originalIndex}">✕</button>
                            </div>
                        </div>
                        <div class="history-girdiler">
                            <span>🚛 Boş: ${item.bosKamyon}</span>
                            <span>🏗️ Dolu: ${item.doluKamyon}</span>
                            <span>📏 Shenk: ${item.shenk}</span>
                            <span>🔄 Eski CF: ${item.eskiCf}</span>
                        </div>
                        <div class="history-values">
                            <span>📊 NET: ${item.net}</span>
                            <span>📉 FARK: ${item.fark}</span>
                            <span>✨ Yeni CF: ${item.yeniCf}</span>
                            <span>⚠️ Hata: ${item.hataOran}</span>
                        </div>
                    </div>
                `;
            }).join('');
            
            // Silme butonları
            document.querySelectorAll('.delete-item').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const index = parseInt(btn.getAttribute('data-index'));
                    if (!isNaN(index)) {
                        kayitlar.splice(index, 1);
                        saveHistory();
                        showMessage('Kayıt silindi 🗑');
                    }
                });
            });
            
            // Paylaşım butonları
            document.querySelectorAll('.share-history-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const index = parseInt(btn.getAttribute('data-index'));
                    if (!isNaN(index)) {
                        paylasKayit(index);
                    }
                });
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function showMessage(msg) {
            if (toastTimeout) clearTimeout(toastTimeout);
            toast.textContent = msg;
            toast.classList.add('show');
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        function parseNumber(value) {
            if (value === null || value === undefined || value === '') return NaN;
            let cleaned = value.toString().trim().replace(/,/g, '.');
            if (cleaned === '') return NaN;
            const num = Number(cleaned);
            return isNaN(num) ? NaN : num;
        }

        function hesapla() {
            const bos = parseNumber(bosInput.value);
            const dolu = parseNumber(doluInput.value);
            const shenk = parseNumber(shenkInput.value);
            const eskiCf = parseNumber(eskiCfInput.value);

            if (isNaN(bos) || isNaN(dolu) || isNaN(shenk) || isNaN(eskiCf)) {
                showMessage('❌ Tüm alanları doldurun');
                return;
            }

            if (shenk === 0) {
                showMessage('❌ Shenk 0 olamaz');
                return;
            }

            if (eskiCf === 0) {
                showMessage('❌ Eski CF 0 olamaz');
                return;
            }

            const net = dolu - bos;
            const fark = net - shenk;
            
            const netTam = Math.round(net).toLocaleString();
            const farkTam = Math.round(fark).toLocaleString();
            
            netSpan.innerText = netTam;
            farkSpan.innerText = farkTam;

            const bosFormatted = Math.round(bos).toLocaleString();
            const doluFormatted = Math.round(dolu).toLocaleString();
            const shenkFormatted = Math.round(shenk).toLocaleString();
            const eskiCfFormatted = eskiCf.toLocaleString(undefined, { minimumFractionDigits: 3, maximumFractionDigits: 6 });

            if (net <= 0) {
                showMessage('❌ Net ağırlık sıfır veya negatif');
                yeniCfSpan.innerText = '—';
                hataOranSpan.innerText = '—';
                sonHesaplanan = null;
                sonGirdiler = null;
                return;
            }

            const netBolShenk = net / shenk;
            const yeniCf = netBolShenk * eskiCf;
            const hataOran = (netBolShenk - 1) * 100;
            
            const yeniCfFormatted = yeniCf.toLocaleString(undefined, { minimumFractionDigits: 4, maximumFractionDigits: 4 });
            const hataFormatted = hataOran.toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
            
            yeniCfSpan.innerText = yeniCfFormatted;
            hataOranSpan.innerText = `%${hataFormatted}`;
            
            sonHesaplanan = {
                net: netTam,
                fark: farkTam,
                yeniCf: yeniCfFormatted,
                hataOran: `%${hataFormatted}`
            };
            
            sonGirdiler = {
                bos: bosFormatted,
                dolu: doluFormatted,
                shenk: shenkFormatted,
                eskiCf: eskiCfFormatted
            };
            
            showMessage('✅ Hesaplama tamamlandı');
        }

        function olusturPaylasimMetni(kayit) {
            let metin = `📋 *KAMYON TARTIM SONUCU*\n`;
            metin += `━━━━━━━━━━━━━━━\n`;
            if (kayit.isim) metin += `🚛 *Araç:* ${kayit.isim}\n`;
            if (kayit.tarih) metin += `📅 *Tarih:* ${kayit.tarih}\n`;
            metin += `━━━━━━━━━━━━━━━\n`;
            metin += `📊 *GİRİŞ DEĞERLERİ*\n`;
            metin += `• Boş: ${kayit.bosKamyon} kg\n`;
            metin += `• Dolu: ${kayit.doluKamyon} kg\n`;
            metin += `• Shenk: ${kayit.shenk} kg\n`;
            metin += `• Eski CF: ${kayit.eskiCf}\n`;
            metin += `━━━━━━━━━━━━━━━\n`;
            metin += `📈 *SONUÇLAR*\n`;
            metin += `• Net: ${kayit.net} kg\n`;
            metin += `• Fark: ${kayit.fark} kg\n`;
            metin += `• Yeni CF: ${kayit.yeniCf}\n`;
            metin += `• Hata Oranı: ${kayit.hataOran}\n`;
            metin += `━━━━━━━━━━━━━━━\n`;
            metin += `✅ Hesaplama tamamlandı`;
            
            return metin;
        }

        function paylasKayit(index) {
            const kayit = kayitlar[index];
            if (!kayit) {
                showMessage('❌ Kayıt bulunamadı');
                return;
            }
            
            const paylasimMetni = olusturPaylasimMetni(kayit);
            
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(paylasimMetni).then(() => {
                    openWhatsApp(paylasimMetni);
                }).catch(() => {
                    openWhatsApp(paylasimMetni);
                });
            } else {
                openWhatsApp(paylasimMetni);
            }
        }

        function openWhatsApp(metin) {
            const encodedText = encodeURIComponent(metin);
            const whatsappUrl = `https://wa.me/?text=${encodedText}`;
            
            showMessage('📤 WhatsApp açılıyor...');
            
            setTimeout(() => {
                window.open(whatsappUrl, '_blank');
            }, 500);
        }

        function kaydet() {
            if (!sonHesaplanan || !sonGirdiler) {
                showMessage('❌ Önce HESAPLA butonuna basın');
                return;
            }
            
            let isim = kayitIsim.value.trim();
            let tarih = kayitTarih.value;
            
            if (!isim) {
                showMessage('⚠️ İsim giriniz');
                return;
            }
            
            if (!tarih) {
                const today = new Date();
                const yyyy = today.getFullYear();
                const mm = String(today.getMonth() + 1).padStart(2, '0');
                const dd = String(today.getDate()).padStart(2, '0');
                tarih = `${yyyy}-${mm}-${dd}`;
                kayitTarih.value = tarih;
            }
            
            const tarihFormatted = tarih.split('-').reverse().join('.');
            
            const yeniKayit = {
                id: Date.now(),
                isim: isim,
                tarih: tarihFormatted,
                bosKamyon: sonGirdiler.bos,
                doluKamyon: sonGirdiler.dolu,
                shenk: sonGirdiler.shenk,
                eskiCf: sonGirdiler.eskiCf,
                net: sonHesaplanan.net,
                fark: sonHesaplanan.fark,
                yeniCf: sonHesaplanan.yeniCf,
                hataOran: sonHesaplanan.hataOran,
                kayitZamani: new Date().toISOString()
            };
            
            kayitlar.unshift(yeniKayit);
            saveHistory();
            
            kayitIsim.value = '';
            showMessage('💾 Başarıyla kaydedildi!');
        }

        function temizleGecmis() {
            if (kayitlar.length === 0) {
                showMessage('📋 Silinecek kayıt yok');
                return;
            }
            if (confirm('Tüm geçmiş kayıtları silmek istediğinize emin misiniz?')) {
                kayitlar = [];
                saveHistory();
                showMessage('🗑 Tüm kayıtlar silindi');
            }
        }

        function temizleInputlar() {
            bosInput.value = '';
            doluInput.value = '';
            shenkInput.value = '';
            eskiCfInput.value = '';
            netSpan.innerText = '—';
            farkSpan.innerText = '—';
            yeniCfSpan.innerText = '—';
            hataOranSpan.innerText = '—';
            sonHesaplanan = null;
            sonGirdiler = null;
            kayitIsim.value = '';
            showMessage('🔄 Form temizlendi');
        }

        hesaplaBtn.addEventListener('click', hesapla);
        resetBtn.addEventListener('click', temizleInputlar);
        kaydetBtn.addEventListener('click', kaydet);
        temizleGecmisBtn.addEventListener('click', temizleGecmis);
        
        [bosInput, doluInput, shenkInput, eskiCfInput].forEach(input => {
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') hesapla();
            });
        });
        
        loadHistory();
        
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        if (!kayitTarih.value) {
            kayitTarih.value = `${yyyy}-${mm}-${dd}`;
        }
    })();
</script>
</body>
</html>
